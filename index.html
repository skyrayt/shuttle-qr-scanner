<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>四眾編號 QR 掃描器</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 引入雙解析引擎：html5-qrcode 與 jsQR -->
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js" type="text/javascript"></script>
  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; overscroll-behavior: none; }
    #reader video { border-radius: 0.75rem; object-fit: cover; }
    .scan-line {
      position: absolute; left: 10%; right: 10%; height: 2px;
      background: linear-gradient(90deg, transparent, #22c55e, transparent);
      box-shadow: 0 0 8px #22c55e;
      animation: scanMove 2s infinite ease-in-out;
      pointer-events: none; z-index: 20;
    }
    @keyframes scanMove {
      0%, 100% { top: 18%; }
      50% { top: 82%; }
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between select-none">

  <!-- 頂部狀態與原畫面參數列 -->
  <header class="bg-slate-900/90 border-b border-slate-800 px-4 py-3 flex justify-between items-center sticky top-0 z-30">
    <div>
      <h1 class="text-base font-bold text-white flex items-center gap-1.5">
        <span>📷</span> 四眾編號掃描 (8碼)
      </h1>
      <div id="contextDisplay" class="text-xs text-slate-400 mt-0.5">載入站點資訊中...</div>
    </div>
    <button type="button" onclick="cancelAndReturn()" class="bg-slate-800 hover:bg-slate-700 active:bg-slate-600 text-slate-200 border border-slate-600 px-3 py-1.5 rounded-lg text-xs font-bold transition">
      ✕ 返回報到頁
    </button>
  </header>

  <!-- 中央相機視窗區 -->
  <main class="flex-1 flex flex-col items-center justify-center p-4">
    <!-- 狀態提示橫幅 -->
    <div id="statusBanner" class="w-full max-w-sm bg-blue-950/80 border border-blue-700 text-blue-200 px-3 py-2.5 rounded-xl text-sm font-bold mb-3 text-center shadow">
      正在啟動相機，請將 8 碼 QR Code 對準方框...
    </div>

    <!-- 掃描成功即時橫幅 -->
    <div id="resultBanner" class="hidden w-full max-w-sm bg-emerald-900/90 border-2 border-emerald-400 text-emerald-100 px-4 py-3 rounded-xl mb-3 text-center shadow-lg">
      <div class="text-xs text-emerald-300 font-bold">✅ 讀取成功！正在自動跳回報到頁...</div>
      <div id="decodedValueDisplay" class="text-2xl font-extrabold tracking-widest mt-1 text-white"></div>
      <button id="manualReturnBtn" type="button" onclick="forceRedirectReturn()" class="hidden mt-3 w-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-extrabold py-2.5 rounded-lg text-sm shadow">
        👉 點此立即返回報到頁查詢
      </button>
    </div>

    <!-- 相機預覽容器 -->
    <div class="relative w-full max-w-sm bg-black rounded-2xl overflow-hidden border-2 border-slate-700 shadow-2xl min-h-[280px] flex items-center justify-center">
      <div id="reader" class="w-full"></div>
      <div id="scanLine" class="scan-line hidden"></div>
    </div>

    <!-- 輔助與備援操作按鈕 -->
    <div class="w-full max-w-sm mt-4 space-y-2.5">
      <button id="captureFrameBtn" type="button" onclick="captureCurrentFrame()" class="hidden w-full bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 text-white font-bold py-3 px-4 rounded-xl shadow text-sm transition">
        📸 對準後點此「立即擷取辨識」
      </button>

      <label class="w-full bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-600 font-bold py-2.5 px-4 rounded-xl shadow text-xs cursor-pointer transition flex items-center justify-center gap-1.5">
        <span>🖼️ 若無法自動對焦，點此用手機原生相機拍照</span>
        <input type="file" accept="image/*" capture="environment" class="hidden" onchange="scanPhotoFile(this)">
      </label>
    </div>
  </main>

  <!-- 底部說明 -->
  <footer class="bg-slate-900/80 border-t border-slate-800 p-3 text-center text-xs text-slate-400">
    掃描到 8 碼四眾編號後，將自動關閉本頁並帶回查詢
  </footer>

<script>
  const urlParams = new URLSearchParams(window.location.search);
  // V06：參數 date、routeId、routeName、keyword、returnUrl、mode（02 §1.2、§8.2）
  const scanContext = {
    date: urlParams.get('date') || '',
    routeId: urlParams.get('routeId') || '',
    routeName: urlParams.get('routeName') || '',
    keyword: urlParams.get('keyword') || '',
    returnUrl: urlParams.get('returnUrl') || '',
    mode: urlParams.get('mode') || ''
  };

  const contextEl = document.getElementById('contextDisplay');
  if (scanContext.date || scanContext.routeId) {
    contextEl.textContent = `日期：${scanContext.date || '當日'} ｜ 路線：${scanContext.routeName || scanContext.routeId || '未指定'}`;
  } else {
    contextEl.textContent = '模式：一鍵自動跳回報到系統';
  }

  /**
   * returnUrl 白名單（02 §8.3）：必須為 https: 且主機為 script.google.com，否則不跳轉（避免開放重導向）
   * @returns {URL|null}
   */
  function getSafeReturnUrl() {
    if (!scanContext.returnUrl) return null;
    try {
      const u = new URL(scanContext.returnUrl);
      if (u.protocol === 'https:' && u.hostname === 'script.google.com') return u;
    } catch (e) {}
    return null;
  }

  let html5QrCode = null;
  let isScanning = false;
  let isHandlingResult = false;
  let assistInterval = null;
  let lastScannedCode = '';

  function playBeep() {
    try {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) return;
      const ctx = new AudioCtx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(1046.5, ctx.currentTime);
      gain.gain.setValueAtTime(0.15, ctx.currentTime);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.12);
    } catch (e) {}
  }

  function extractEightDigitId(rawText) {
    const trimmed = String(rawText || '').trim();
    if (!trimmed) return null;
    if (/^\d{8}$/.test(trimmed)) return trimmed;
    const match = trimmed.match(/(?:^|\D)(\d{8})(?:\D|$)/);
    return match ? match[1] : null;
  }

  function onScanSuccess(rawText) {
    if (isHandlingResult) return;
    const code8 = extractEightDigitId(rawText);
    const statusBanner = document.getElementById('statusBanner');

    if (!code8) {
      statusBanner.className = 'w-full max-w-sm bg-amber-900/80 border border-amber-500 text-amber-200 px-3 py-2.5 rounded-xl text-xs font-bold mb-3 text-center shadow';
      statusBanner.textContent = `⚠️ 讀取內容「${String(rawText).substring(0, 20)}」非 8 碼數字，請對準四眾編號條碼`;
      return;
    }

    isHandlingResult = true;
    lastScannedCode = code8;

    if (navigator.vibrate) {
      try { navigator.vibrate(100); } catch (e) {}
    }
    playBeep();

    statusBanner.classList.add('hidden');
    const resultBanner = document.getElementById('resultBanner');
    const decodedDisplay = document.getElementById('decodedValueDisplay');
    resultBanner.classList.remove('hidden');
    decodedDisplay.textContent = code8;

    const messagePayload = {
      type: 'GAS_QR_SCAN_RESULT',
      qrCode: code8,
      context: {
        date: scanContext.date,
        routeId: scanContext.routeId,
        keyword: scanContext.keyword,
        mode: scanContext.mode
      },
      timestamp: Date.now()
    };

    stopScanner().finally(() => {
      let sentViaOpener = false;
      try {
        if (window.opener && !window.opener.closed) {
          window.opener.postMessage(messagePayload, '*');
          sentViaOpener = true;
        }
      } catch (e) {
        sentViaOpener = false;
      }

      if (sentViaOpener) {
        setTimeout(() => {
          try { window.close(); } catch (e) {}
          setTimeout(() => {
            document.getElementById('manualReturnBtn').classList.remove('hidden');
          }, 600);
        }, 150);
      } else {
        forceRedirectReturn(code8);
      }
    });
  }

  function forceRedirectReturn(codeToUse) {
    const finalCode = codeToUse || lastScannedCode;
    const safeUrl = getSafeReturnUrl();
    if (safeUrl && finalCode && /^\d{8}$/.test(finalCode)) {
      // 備援通道僅帶回 qr、routeId、mode（日期由後端決定，不帶回）
      safeUrl.searchParams.set('qr', finalCode);
      if (scanContext.routeId) safeUrl.searchParams.set('routeId', scanContext.routeId);
      if (scanContext.mode) safeUrl.searchParams.set('mode', scanContext.mode);
      window.location.replace(safeUrl.toString());
    } else {
      if (scanContext.returnUrl && !safeUrl) {
        document.getElementById('decodedValueDisplay').textContent = '返回網址不合法，請手動返回報到頁';
      }
      try { window.close(); } catch (e) {}
      document.getElementById('manualReturnBtn').classList.remove('hidden');
    }
  }

  function cancelAndReturn() {
    stopScanner().finally(() => {
      if (window.opener && !window.opener.closed) {
        try { window.close(); return; } catch (e) {}
      }
      const safeUrl = getSafeReturnUrl();
      if (safeUrl) {
        window.location.replace(safeUrl.toString());
      } else {
        history.back();
      }
    });
  }

  function decodeFromCanvas(canvas) {
    return new Promise((resolve) => {
      const ctx = canvas.getContext('2d', { willReadFrequently: true });
      if (!ctx || !canvas.width || !canvas.height) return resolve(null);

      if (typeof jsQR === 'function') {
        try {
          const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
          const res = jsQR(imgData.data, imgData.width, imgData.height, { inversionAttempts: 'attemptBoth' });
          if (res && res.data && extractEightDigitId(res.data)) {
            return resolve(res.data);
          }
        } catch (e) {}
      }

      if ('BarcodeDetector' in window) {
        try {
          const detector = new BarcodeDetector({ formats: ['qr_code', 'code_128', 'code_39'] });
          detector.detect(canvas)
            .then(codes => {
              if (codes && codes.length > 0 && codes[0].rawValue) {
                resolve(codes[0].rawValue);
              } else {
                resolve(null);
              }
            })
            .catch(() => resolve(null));
          return;
        } catch (e) {}
      }
      resolve(null);
    });
  }

  function startAssistLoop() {
    stopAssistLoop();
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });

    assistInterval = setInterval(() => {
      if (!isScanning || isHandlingResult) return;
      const video = document.querySelector('#reader video');
      if (!video || video.readyState < 2 || !video.videoWidth) return;

      const vw = video.videoWidth;
      const vh = video.videoHeight;
      const cropW = Math.round(vw * 0.55);
      const cropH = Math.round(vh * 0.55);
      const sx = Math.round((vw - cropW) / 2);
      const sy = Math.round((vh - cropH) / 2);

      canvas.width = 600;
      canvas.height = 600;
      ctx.drawImage(video, sx, sy, cropW, cropH, 0, 0, 600, 600);

      decodeFromCanvas(canvas).then(res => {
        if (res && !isHandlingResult) onScanSuccess(res);
      });
    }, 220);
  }

  function stopAssistLoop() {
    if (assistInterval) {
      clearInterval(assistInterval);
      assistInterval = null;
    }
  }

  function captureCurrentFrame() {
    const video = document.querySelector('#reader video');
    if (!video || !video.videoWidth) return;
    const canvas = document.createElement('canvas');
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    canvas.getContext('2d').drawImage(video, 0, 0);
    decodeFromCanvas(canvas).then(res => {
      if (res) onScanSuccess(res);
    });
  }

  function scanPhotoFile(input) {
    if (!input.files || !input.files[0]) return;
    const file = input.files[0];
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      const canvas = document.createElement('canvas');
      const scale = Math.min(1, 1200 / Math.max(img.width, img.height));
      canvas.width = Math.round(img.width * scale);
      canvas.height = Math.round(img.height * scale);
      canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
      decodeFromCanvas(canvas).then(res => {
        input.value = '';
        if (res) {
          onScanSuccess(res);
        } else {
          const statusBanner = document.getElementById('statusBanner');
          statusBanner.classList.remove('hidden');
          statusBanner.textContent = '❌ 照片中未偵測到清晰的 8 碼 QR Code，請重試';
        }
      });
    };
    img.src = url;
  }

  function startScanner() {
    if (isScanning) return;
    isHandlingResult = false;
    const statusBanner = document.getElementById('statusBanner');

    try {
      if (!html5QrCode) {
        html5QrCode = new Html5Qrcode("reader", {
          experimentalFeatures: { useBarCodeDetectorIfSupported: true },
          verbose: false
        });
      }
    } catch (e) {
      html5QrCode = new Html5Qrcode("reader");
    }

    const config = {
      fps: 18,
      qrbox: (vw, vh) => {
        const size = Math.max(Math.floor(Math.min(vw, vh) * 0.72), 190);
        return { width: size, height: size };
      },
      aspectRatio: 1.0
    };

    html5QrCode.start(
      { facingMode: "environment" },
      config,
      (decodedText) => onScanSuccess(decodedText),
      () => {}
    ).then(() => {
      isScanning = true;
      statusBanner.className = 'w-full max-w-sm bg-emerald-950/80 border border-emerald-600 text-emerald-200 px-3 py-2.5 rounded-xl text-sm font-bold mb-3 text-center shadow';
      statusBanner.textContent = '📷 相機運作中，請對準 8 碼四眾編號 QR Code';
      document.getElementById('scanLine').classList.remove('hidden');
      document.getElementById('captureFrameBtn').classList.remove('hidden');
      startAssistLoop();
    }).catch((err) => {
      isScanning = false;
      statusBanner.className = 'w-full max-w-sm bg-amber-900/90 border border-amber-500 text-amber-100 px-3 py-2.5 rounded-xl text-xs font-bold mb-3 text-center shadow';
      statusBanner.textContent = '⚠️ 請允許相機權限，或點擊下方按鈕使用手機原生相機拍照辨識';
    });
  }

  function stopScanner() {
    stopAssistLoop();
    document.getElementById('scanLine').classList.add('hidden');
    if (html5QrCode && isScanning) {
      return html5QrCode.stop().then(() => {
        isScanning = false;
        html5QrCode.clear();
      }).catch(() => {
        isScanning = false;
      });
    }
    return Promise.resolve();
  }

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && !isScanning && !isHandlingResult) {
      startScanner();
    } else if (document.visibilityState === 'hidden' && isScanning) {
      stopScanner();
    }
  });

  window.addEventListener('DOMContentLoaded', startScanner);
</script>
</body>
</html>
